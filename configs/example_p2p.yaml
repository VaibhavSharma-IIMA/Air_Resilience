# A point-to-point operation with no hub, flying a timetable read from CSV.
# Its only purpose is to show the framework is not hub-and-spoke by construction.
name: example-point-to-point
description: Small European point-to-point network, schedule loaded from file
days: 5
seed: 11

network:
  hub: AMS                       # a base for reporting; no rotation structure assumes it
  airports:
    - {code: AMS, name: Amsterdam, lat: 52.3105, lon:  4.7683}
    - {code: CDG, name: Paris,     lat: 49.0097, lon:  2.5479}
    - {code: BER, name: Berlin,    lat: 52.3667, lon: 13.5033}
    - {code: MAD, name: Madrid,    lat: 40.4936, lon: -3.5668}
    - {code: FCO, name: Rome,      lat: 41.8003, lon: 12.2389}
    - {code: VIE, name: Vienna,    lat: 48.1103, lon: 16.5697}
    - {code: CPH, name: Copenhagen,lat: 55.6180, lon: 12.6560}
    - {code: LIS, name: Lisbon,    lat: 38.7756, lon: -9.1354}

fleet:
  count: 14
  turn_minutes:  {hub: 45, outstation: 45}
  slack_minutes: {hub: 0,  outstation: 0}
  overnight_ground_minutes: 360
  repositioning_per_night: 2

crew:
  units_per_aircraft: 3.0
  unit_size: 2
  callout_minutes: 90

schedule:
  source: file
  path: ../examples/point_to_point/schedule.csv

regulation:
  name: generic-short-haul
  max_duty_minutes: 480
  max_legs_per_duty: 4
  min_rest_minutes: 660
  report_before_minutes: 45
  debrief_after_minutes: 30
  rolling:
    - {days: 7, max_duty_minutes: 3300}
  weekly_rest_days: 1
  roster_headroom_minutes: 30

policy:
  standby_pct: 0
  repositioning_per_night: 2

conditions:
  1: [fog]
  2: [fog]

parameters:
  - {name: crews_per_aircraft, value: 3.0, provenance: assumed, unit: crews/aircraft}
